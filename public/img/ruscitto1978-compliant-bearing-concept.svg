<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400">
  <rect width="640" height="400" fill="#faf9f5"/>
  <text x="320" y="32" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#1a5e54" font-weight="600">フォイル軸受と、軸内蔵プローブによる膜厚測定（模式図）</text>
  <text x="320" y="54" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#6b6b63">模式・実データではない。寸法・枚数・すきま量は実物と一致しない（すきまと偏心は誇張）</text>

  <circle cx="200" cy="215" r="140" fill="#eceae2" stroke="#3a3a34" stroke-width="2"/>
  <circle cx="200" cy="215" r="126" fill="none" stroke="#8a6d3b" stroke-width="7" stroke-dasharray="9,7"/>
  <circle cx="200" cy="215" r="114" fill="#faf9f5" stroke="#1a5e54" stroke-width="2"/>
  <circle cx="200" cy="223" r="104" fill="#d5e5e1" stroke="#3a3a34" stroke-width="2"/>
  <path d="M 200 223 m -104 0 a 104 104 0 0 1 0 0" fill="none"/>
  <rect x="194" y="121" width="12" height="16" fill="#3a3a34" transform="rotate(35 200 223) translate(0 0)"/>
  <circle cx="200" cy="223" r="3" fill="#3a3a34"/>
  <path d="M 268 150 A 104 104 0 0 1 300 223" fill="none" stroke="#1a5e54" stroke-width="2" marker-end="url(#a)"/>
  <defs><marker id="a" viewBox="0 0 8 8" refX="6" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#1a5e54"/></marker></defs>
  <text x="296" y="262" font-family="sans-serif" font-size="12" fill="#1a5e54">回転方向</text>

  <line x1="200" y1="392" x2="200" y2="356" stroke="#a23b2a" stroke-width="3"/>
  <path d="M 194 366 L 200 356 L 206 366 z" fill="#a23b2a"/>
  <text x="212" y="386" font-family="sans-serif" font-size="12" fill="#a23b2a">荷重</text>

  <text x="60" y="84" font-family="sans-serif" font-size="12" fill="#3a3a34">軸受ハウジング</text>
  <line x1="110" y1="90" x2="120" y2="130" stroke="#6b6b63"/>
  <text x="352" y="120" font-family="sans-serif" font-size="12" fill="#8a6d3b">バンプ箔（波形の弾性支持）</text>
  <line x1="350" y1="118" x2="318" y2="140" stroke="#8a6d3b"/>
  <text x="352" y="146" font-family="sans-serif" font-size="12" fill="#1a5e54">トップ箔（平滑な箔）</text>
  <line x1="350" y1="144" x2="308" y2="160" stroke="#1a5e54"/>
  <text x="352" y="296" font-family="sans-serif" font-size="12" fill="#3a3a34">ジャーナル（軸）</text>

  <text x="352" y="222" font-family="sans-serif" font-size="12" fill="#3a3a34">軸表面に埋め込んだ</text>
  <text x="352" y="238" font-family="sans-serif" font-size="12" fill="#3a3a34">静電容量式近接プローブ</text>
  <text x="352" y="254" font-family="sans-serif" font-size="12" fill="#3a3a34">（回転しながら箔までの距離を測る）</text>
  <line x1="348" y1="232" x2="246" y2="140" stroke="#3a3a34" stroke-dasharray="3,3"/>

  <text x="352" y="330" font-family="sans-serif" font-size="12" fill="#3a3a34">信号は軸端のブラシとスリップリングで</text>
  <text x="352" y="346" font-family="sans-serif" font-size="12" fill="#3a3a34">静止側へ取り出す</text>
</svg>
