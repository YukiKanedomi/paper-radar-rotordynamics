<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" width="640" height="420">
  <rect width="640" height="420" fill="#faf9f5"/>
  <text x="320" y="34" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#1a5e54" font-weight="600">従来型バンプフォイル vs フレキシブルアーチ構造の模式図</text>
  <text x="320" y="56" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#6b6b63">模式図・実データではない。フレキシブルアーチの具体的形状は抄録に記載がなく、イメージ図として描いたもの</text>

  <!-- left panel: conventional bump foil -->
  <text x="160" y="90" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#3a3a34" font-weight="600">従来型バンプフォイル（一般的なコルゲート形）</text>
  <rect x="60" y="115" width="200" height="10" fill="#8a6d3b"/>
  <text x="270" y="123" font-family="sans-serif" font-size="9" fill="#8a6d3b">軸受スリーブ（外側）</text>
  <path d="M 60 150 Q 85 192 110 150 Q 135 192 160 150 Q 185 192 210 150 Q 235 192 260 150" fill="none" stroke="#8a6d3b" stroke-width="3"/>
  <text x="270" y="150" font-family="sans-serif" font-size="9" fill="#8a6d3b">バンプフォイル</text>
  <rect x="60" y="194" width="200" height="8" fill="#e9e5d8" stroke="#3a3a34" stroke-width="1"/>
  <text x="270" y="212" font-family="sans-serif" font-size="9" fill="#3a3a34">トップフォイル</text>
  <circle cx="85" cy="192" r="4" fill="#b4451f"/>
  <circle cx="135" cy="192" r="4" fill="#b4451f"/>
  <circle cx="185" cy="192" r="4" fill="#b4451f"/>
  <circle cx="235" cy="192" r="4" fill="#b4451f"/>
  <text x="160" y="235" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#b4451f">バンプ頂点とトップフォイルの接触部に応力が集中しやすい</text>

  <!-- right panel: flexible arch -->
  <text x="480" y="90" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#3a3a34" font-weight="600">提案構造（フレキシブルアーチ、イメージ）</text>
  <rect x="380" y="115" width="200" height="10" fill="#1a5e54"/>
  <text x="590" y="123" font-family="sans-serif" font-size="9" fill="#1a5e54" text-anchor="end">軸受スリーブ（外側）</text>
  <path d="M 380 160 Q 405 192 430 160 Q 455 192 480 160 Q 505 192 530 160 Q 555 192 580 160" fill="none" stroke="#1a5e54" stroke-width="3"/>
  <text x="590" y="150" font-family="sans-serif" font-size="9" fill="#1a5e54" text-anchor="end">フレキシブルアーチ</text>
  <rect x="380" y="194" width="200" height="8" fill="#e9e5d8" stroke="#3a3a34" stroke-width="1"/>
  <text x="590" y="212" font-family="sans-serif" font-size="9" fill="#3a3a34" text-anchor="end">トップフォイル</text>
  <circle cx="405" cy="192" r="4" fill="#1a5e54"/>
  <circle cx="455" cy="192" r="4" fill="#1a5e54"/>
  <circle cx="505" cy="192" r="4" fill="#1a5e54"/>
  <circle cx="555" cy="192" r="4" fill="#1a5e54"/>
  <text x="480" y="235" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1a5e54">接触部の応力集中が和らぐとされる（抄録の定性的な記述）</text>

  <line x1="320" y1="70" x2="320" y2="260" stroke="#c9c4b6" stroke-width="1" stroke-dasharray="3,3"/>

  <text x="320" y="300" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#3a3a34">同じ荷重・回転速度条件で比較すると、フレキシブルアーチは最大応力と表面変位が明確に小さくなる一方、</text>
  <text x="320" y="320" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#3a3a34">フォイル間の摩擦により表面温度は初期構造より高くなる、という論文の定性的な結論をこの図は表す。</text>
</svg>
