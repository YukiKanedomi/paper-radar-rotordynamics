<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 600 220'><rect width='600' height='220' fill='#faf9f5'/><text x='300' y='24' font-family='sans-serif' font-size='12.5' fill='#114a42' text-anchor='middle' font-weight='700'>単スパンロータと交差剛性の付与位置のイメージ（模式・実データではない）</text><line x1='90' y1='120' x2='510' y2='120' stroke='#1d2127' stroke-width='6'/><polygon points='130,126 110,156 150,156' fill='none' stroke='#6c7078' stroke-width='1.6'/><polygon points='470,126 450,156 490,156' fill='none' stroke='#6c7078' stroke-width='1.6'/><text x='130' y='176' font-family='sans-serif' font-size='10.5' fill='#6c7078' text-anchor='middle'>軸受</text><text x='470' y='176' font-family='sans-serif' font-size='10.5' fill='#6c7078' text-anchor='middle'>軸受</text><text x='300' y='108' font-family='sans-serif' font-size='10.5' fill='#1d2127' text-anchor='middle'>スパン（軸受間）</text><rect x='525' y='104' width='6' height='32' fill='#1a5e54'/><text x='560' y='88' font-family='sans-serif' font-size='10.5' fill='#1a5e54' text-anchor='middle'>非駆動端</text><text x='560' y='102' font-family='sans-serif' font-size='10.5' fill='#1a5e54' text-anchor='middle'>（NDE）</text><defs><marker id='ma' markerWidth='8' markerHeight='8' refX='6' refY='3' orient='auto'><path d='M0,0 L6,3 L0,6 z' fill='#b4451f'/></marker></defs><path d='M540 196 L540 142' stroke='#b4451f' stroke-width='2' marker-end='url(#ma)'/><text x='420' y='200' font-family='sans-serif' font-size='10.5' fill='#8a3417' text-anchor='middle'>交差剛性（正・負）を能動的に付与</text><path d='M300 60 L300 92' stroke='#b4451f' stroke-width='2' stroke-dasharray='4 3' marker-end='url(#ma)'/><text x='300' y='52' font-family='sans-serif' font-size='10' fill='#8a3417' text-anchor='middle'>（比較：スパン内に付与する場合）</text></svg>
