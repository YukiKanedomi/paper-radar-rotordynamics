<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400">
  <rect width="640" height="400" fill="#faf9f5"/>
  <text x="320" y="32" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#1a5e54" font-weight="600">箔支持の弾性パッド型ガススラスト軸受（断面の模式図）</text>
  <text x="320" y="54" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#6b6b63">模式・実データではない。寸法・傾き・支点位置・パッド数は誇張・簡略化（実機は6パッド）</text>

  <rect x="50" y="86" width="540" height="22" fill="#d5e5e1" stroke="#3a3a34" stroke-width="1.5"/>
  <text x="60" y="102" font-family="sans-serif" font-size="12" fill="#3a3a34">ランナ（回転側）</text>
  <line x1="450" y1="97" x2="556" y2="97" stroke="#1a5e54" stroke-width="2"/>
  <path d="M 548 91 L 558 97 L 548 103 z" fill="#1a5e54"/>
  <text x="330" y="126" font-family="sans-serif" font-size="12" fill="#1a5e54">回転方向 →（左が入口＝</text>
  <text x="330" y="141" font-family="sans-serif" font-size="12" fill="#1a5e54">リーディングエッジ側）</text>

  <polygon points="111,154 251,146 251,160 111,168" fill="#eceae2" stroke="#3a3a34"/>
  <polygon points="316,154 456,146 456,160 316,168" fill="#eceae2" stroke="#3a3a34"/>
  <text x="60" y="126" font-family="sans-serif" font-size="12" fill="#3a3a34">剛体の平板パッド</text>
  <text x="60" y="142" font-family="sans-serif" font-size="12" fill="#3a3a34">（カーボングラファイト）</text>

  <path d="M 70 194 L 111 170 L 251 162 L 275 194 L 316 170 L 456 162 L 480 194" stroke="#8a6d3b" stroke-width="4" fill="none"/>
  <text x="300" y="222" font-size="12" font-family="sans-serif" fill="#8a6d3b">金属箔の梁にパッドを接着</text>

  <line x1="70" y1="226" x2="111" y2="226" stroke="#3a3a34"/>
  <text x="90" y="220" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#3a3a34">b</text>
  <line x1="251" y1="226" x2="275" y2="226" stroke="#3a3a34"/>
  <text x="263" y="220" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#3a3a34">a</text>

  <polygon points="70,196 64,262 76,262" fill="#3a3a34"/>
  <polygon points="275,196 269,262 281,262" fill="#3a3a34"/>
  <polygon points="480,196 474,262 486,262" fill="#3a3a34"/>
  <rect x="50" y="262" width="540" height="16" fill="#eceae2" stroke="#3a3a34" stroke-width="1.5"/>
  <text x="60" y="296" font-family="sans-serif" font-size="12" fill="#3a3a34">支持構造（ステータ側）</text>
  <text x="290" y="296" font-family="sans-serif" font-size="12" fill="#3a3a34">箔の支点</text>

  <text x="50" y="326" font-family="sans-serif" font-size="12" fill="#3a3a34">b：入口側の箔の長さ、a：出口側の箔の長さ（報告書の b/a は 1.7）。</text>
  <text x="50" y="346" font-family="sans-serif" font-size="12" fill="#3a3a34">平板のパッドは、箔の梁のたわみで傾き、入口側が広く出口側が狭いくさび状のすきまができる、</text>
  <text x="50" y="364" font-family="sans-serif" font-size="12" fill="#3a3a34">という報告書の設計思想を描いた本サイトの説明図。支点は共有する形で簡略化。</text>
</svg>
