<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400">
  <rect width="640" height="400" fill="#faf9f5"/>
  <text x="320" y="32" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#1a5e54" font-weight="600">静圧空気軸受の凹面と減衰（模式図）</text>
  <text x="320" y="54" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#6b6b63">模式図・実データではない。抄録の記述（滑らかな凹面が減衰を高める）を概念化して本サイトで作成。形状・寸法は説明用</text>

  <!-- left: flat pocket -->
  <text x="170" y="96" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#3a3a34" font-weight="600">従来のポケット型（模式）</text>
  <rect x="70" y="120" width="200" height="22" fill="#3a3a34"/>
  <rect x="70" y="142" width="200" height="8" fill="#c9a86b" opacity="0.7"/>
  <rect x="120" y="142" width="100" height="18" fill="#faf9f5" stroke="#3a3a34" stroke-width="1"/>
  <rect x="70" y="170" width="200" height="22" fill="#1a5e54" opacity="0.85"/>
  <text x="170" y="222" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#3a3a34">比較対象：従来のポケット型（抄録より）</text>

  <!-- right: smooth concave -->
  <text x="470" y="96" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#3a3a34" font-weight="600">滑らかな凹面（模式）</text>
  <rect x="370" y="120" width="200" height="22" fill="#3a3a34"/>
  <path d="M370 142 Q470 176 570 142 Z" fill="#faf9f5" stroke="#8a6d3b" stroke-width="1.5"/>
  <rect x="370" y="170" width="200" height="22" fill="#1a5e54" opacity="0.85"/>
  <text x="470" y="222" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#b4451f">提案：滑らかな凹面——減衰向上・微小振動の抑制（抄録より）</text>

  <line x1="320" y1="90" x2="320" y2="230" stroke="#c9c4b6" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="320" y="282" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#3a3a34">抄録によれば、凹面を持つ静圧空気軸受は、負荷容量と静剛性を損なわずに</text>
  <text x="320" y="302" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#3a3a34">微振動を最大35.2%低減し、減衰係数を最大786.6%向上させた（従来型・市販溝付き軸受との比較）。</text>
  <text x="320" y="338" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#6b6b63">給気孔・ポケット形状の詳細は抄録に無いため描いていない。</text>
</svg>
