<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" width="640" height="420">
  <rect width="640" height="420" fill="#faf9f5"/>
  <text x="320" y="32" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#1a5e54" font-weight="600">油潤滑フォイル軸受の考え方（模式図）</text>
  <text x="320" y="54" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#6b6b63">模式図・実データではない。抄録の記述（油潤滑ジャーナル軸受とフォイル軸受の利点の組み合わせ）を概念化して本サイトで作成</text>

  <!-- left: rigid oil bearing -->
  <text x="160" y="96" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#3a3a34" font-weight="600">剛な油潤滑ジャーナル軸受</text>
  <circle cx="160" cy="185" r="62" fill="none" stroke="#3a3a34" stroke-width="3"/>
  <circle cx="163" cy="190" r="46" fill="#c9a86b" opacity="0.8"/>
  <circle cx="166" cy="194" r="38" fill="#1a5e54" opacity="0.85"/>
  <text x="160" y="278" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#3a3a34">剛な軸受面に油膜（従来の油潤滑ジャーナル軸受）</text>

  <!-- right: oil-lubricated foil -->
  <text x="480" y="96" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#3a3a34" font-weight="600">油潤滑フォイル軸受</text>
  <circle cx="480" cy="185" r="62" fill="none" stroke="#3a3a34" stroke-width="3"/>
  <path d="M424 200 q10 -16 20 0 q10 16 20 0 q10 -16 20 0 q10 16 20 0 q10 -16 20 0 q10 16 20 0 q10 -16 20 0" fill="none" stroke="#8a6d3b" stroke-width="2.5" transform="translate(-4 -18)"/>
  <circle cx="483" cy="190" r="44" fill="#c9a86b" opacity="0.5" stroke="#8a6d3b" stroke-width="2"/>
  <circle cx="486" cy="194" r="38" fill="#1a5e54" opacity="0.85"/>
  <text x="480" y="278" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#b4451f">柔らかい箔構造が減衰を与え、安定余裕を広げる</text>

  <line x1="320" y1="90" x2="320" y2="290" stroke="#c9c4b6" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="320" y="330" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#3a3a34">抄録によれば、適切に設計した油潤滑フォイル軸受は減衰性能に優れ、</text>
  <text x="320" y="350" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#3a3a34">最良の試験体では試験回転数域（〜15,000 rpm）でオイルホイップとオイルスピンを解消した。</text>
  <text x="320" y="380" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#6b6b63">箔・油膜の形状は説明用の抽象化で、実際の軸受構造ではない。</text>
</svg>
