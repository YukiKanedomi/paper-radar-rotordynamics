<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" width="640" height="420">
  <rect width="640" height="420" fill="#faf9f5"/>
  <text x="320" y="34" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#1a5e54" font-weight="600">ガスフォイル軸受の断面模式図</text>
  <text x="320" y="56" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#6b6b63">模式図・実データではない。原論文Fig.1の構成（バンプフォイル・トップフォイル・ベアリングスリーブ・ジャーナル）をもとに本サイトで作成</text>

  <circle cx="320" cy="230" r="150" fill="none" stroke="#3a3a34" stroke-width="3"/>
  <text x="500" y="140" font-family="sans-serif" font-size="12" fill="#3a3a34">ベアリングスリーブ（外側）</text>

  <circle cx="320" cy="230" r="128" fill="none" stroke="#8a6d3b" stroke-width="2" stroke-dasharray="1,0"/>
  <path d="M 320,102
    a 128,128 0 0,1 22,3
    a 14,14 0 0,0 0,22
    a 128,128 0 0,1 22,9
    a 14,14 0 0,0 4,22
    a 128,128 0 0,1 18,15
    a 14,14 0 0,0 8,20
    a 128,128 0 0,1 13,20
    a 14,14 0 0,0 11,18" fill="none" stroke="#8a6d3b" stroke-width="2"/>
  <text x="505" y="200" font-family="sans-serif" font-size="12" fill="#8a6d3b">バンプフォイル（波形の弾性支持）</text>

  <circle cx="320" cy="230" r="108" fill="none" stroke="#1a5e54" stroke-width="2.5"/>
  <text x="440" y="270" font-family="sans-serif" font-size="12" fill="#1a5e54">トップフォイル（滑らかな内面）</text>

  <circle cx="320" cy="230" r="70" fill="#e9e5d8" stroke="#3a3a34" stroke-width="2"/>
  <text x="320" y="235" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#3a3a34">ジャーナル（軸）</text>

  <path d="M 370 195 a 55 55 0 0 1 20 20" fill="none" stroke="#b4451f" stroke-width="2" marker-end="url(#arrow)"/>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b4451f"/>
    </marker>
  </defs>
  <text x="410" y="200" font-family="sans-serif" font-size="11" fill="#b4451f">回転方向</text>

  <text x="320" y="400" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#3a3a34">ジャーナルが回転すると、トップフォイルとの間に圧力を持つ気体膜ができて軸を浮かせる。</text>
</svg>
