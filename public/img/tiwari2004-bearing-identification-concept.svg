<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 360" width="680" height="360">
  <rect width="680" height="360" fill="#faf9f5"/>
  <text x="340" y="30" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#1a5e54" font-weight="600">軸受の動特性係数を「測って求める」流れ（模式図）</text>
  <text x="340" y="50" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#6b6b63">模式・実データではない。抄録が挙げる要素（励振・計測・モデル化・パラメータ抽出・不確かさ）を並べた説明用の図。</text>

  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#3a3a34"/></marker></defs>
  <g font-family="sans-serif" font-size="14" text-anchor="middle">
    <rect x="30" y="100" width="130" height="90" rx="6" fill="#dfeae6" stroke="#1a5e54" stroke-width="1.5"/>
    <text x="95" y="132" fill="#1a5e54" font-weight="600">1. 加振</text>
    <text x="95" y="156" fill="#3a3a34" font-size="12">励振の方法で</text>
    <text x="95" y="174" fill="#3a3a34" font-size="12">手法を分類</text>

    <rect x="190" y="100" width="130" height="90" rx="6" fill="#dfeae6" stroke="#1a5e54" stroke-width="1.5"/>
    <text x="255" y="132" fill="#1a5e54" font-weight="600">2. 計測</text>
    <text x="255" y="156" fill="#3a3a34" font-size="12">振動応答を</text>
    <text x="255" y="174" fill="#3a3a34" font-size="12">測定する</text>

    <rect x="350" y="100" width="130" height="90" rx="6" fill="#dfeae6" stroke="#1a5e54" stroke-width="1.5"/>
    <text x="415" y="132" fill="#1a5e54" font-weight="600">3. モデル化</text>
    <text x="415" y="156" fill="#3a3a34" font-size="12">ロータ・軸受系の</text>
    <text x="415" y="174" fill="#3a3a34" font-size="12">運動方程式</text>

    <rect x="510" y="100" width="140" height="90" rx="6" fill="#dfeae6" stroke="#1a5e54" stroke-width="1.5"/>
    <text x="580" y="132" fill="#1a5e54" font-weight="600">4. 係数の抽出</text>
    <text x="580" y="156" fill="#3a3a34" font-size="12">時間領域・周波数</text>
    <text x="580" y="174" fill="#3a3a34" font-size="12">領域のアルゴリズム</text>
  </g>
  <line x1="160" y1="145" x2="188" y2="145" stroke="#3a3a34" stroke-width="1.6" marker-end="url(#ar)"/>
  <line x1="320" y1="145" x2="348" y2="145" stroke="#3a3a34" stroke-width="1.6" marker-end="url(#ar)"/>
  <line x1="480" y1="145" x2="508" y2="145" stroke="#3a3a34" stroke-width="1.6" marker-end="url(#ar)"/>

  <line x1="580" y1="192" x2="580" y2="250" stroke="#b4451f" stroke-width="1.6" marker-end="url(#ar)"/>
  <rect x="470" y="252" width="180" height="56" rx="6" fill="#fbeee8" stroke="#b4451f" stroke-width="1.5"/>
  <text x="560" y="276" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#7a2d10" font-weight="600">推定値には不確かさが伴う</text>
  <text x="560" y="294" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#7a2d10">（抄録が論点として挙げる）</text>

  <text x="30" y="290" font-family="sans-serif" font-size="12" fill="#6b6b63">対象：さまざまな軸受と、回転部と静止部を結ぶ類似の要素</text>
</svg>
