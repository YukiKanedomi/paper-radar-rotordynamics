<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400">
  <rect width="640" height="400" fill="#faf9f5"/>
  <text x="320" y="34" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#1a5e54" font-weight="600">トップフォイルの実測高さの模式図（直線近似 vs 曲面形状）</text>
  <text x="320" y="56" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#6b6b63">模式図・実データではない。定性的な形状の違いのみを示す</text>

  <!-- axes -->
  <line x1="90" y1="330" x2="560" y2="330" stroke="#3a3a34" stroke-width="1.5"/>
  <line x1="90" y1="330" x2="90" y2="90" stroke="#3a3a34" stroke-width="1.5"/>
  <text x="560" y="378" text-anchor="end" font-family="sans-serif" font-size="12" fill="#3a3a34">パッド角 θ（傾斜域の入口→境界→フラット域）</text>
  <text x="70" y="90" text-anchor="end" font-family="sans-serif" font-size="12" fill="#3a3a34">トップフォイル高さ（実測）</text>

  <!-- linear reference (straight rise from 0 to boundary) -->
  <line x1="90" y1="330" x2="330" y2="130" stroke="#8a6d3b" stroke-width="2.5" stroke-dasharray="6,4"/>
  <text x="345" y="128" font-family="sans-serif" font-size="12" fill="#8a6d3b">直線近似（従来モデル）</text>

  <!-- measured/curved profile: concave, bulges ABOVE (smaller y = higher plotted value than) the straight line -->
  <path d="M 90 330 Q 210 150 330 130" fill="none" stroke="#1a5e54" stroke-width="3"/>
  <text x="345" y="150" font-family="sans-serif" font-size="12" fill="#1a5e54">実測に基づく曲面形状（本研究のモデル）</text>

  <!-- flat area continues at max height -->
  <line x1="330" y1="130" x2="500" y2="128" stroke="#3a3a34" stroke-width="2"/>
  <text x="410" y="115" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#3a3a34">フラット域（高さほぼ一定）</text>

  <line x1="330" y1="330" x2="330" y2="130" stroke="#c9c4b6" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="330" y="345" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#6b6b63">傾斜域→フラット域の境界</text>
</svg>
