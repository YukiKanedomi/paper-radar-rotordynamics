<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" width="640" height="420">
  <rect width="640" height="420" fill="#faf9f5"/>
  <text x="320" y="34" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#1a5e54" font-weight="600">2軸式の摂動試験装置の模式図</text>
  <text x="320" y="56" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#6b6b63">模式図・実データではない。原論文Fig.1の試験装置の構成を単純化して示す</text>

  <!-- main shaft -->
  <rect x="70" y="200" width="420" height="14" fill="#8a6d3b"/>
  <text x="280" y="195" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#3a3a34">主軸（回転速度 ω_R、一定）</text>

  <!-- oil bearing at journal -->
  <rect x="250" y="180" width="60" height="54" fill="none" stroke="#1a5e54" stroke-width="2.5"/>
  <text x="280" y="255" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1a5e54">円筒すべり軸受（油膜）</text>

  <!-- rolling pivoting bearing at left end -->
  <circle cx="90" cy="207" r="16" fill="none" stroke="#3a3a34" stroke-width="2"/>
  <text x="90" y="245" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#3a3a34">転がり軸受</text>

  <!-- additional springs -->
  <path d="M 400 214 q 8 -16 16 0 t 16 0 t 16 0" fill="none" stroke="#b4451f" stroke-width="2"/>
  <text x="440" y="255" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#b4451f">追加ばね（S/SM構成のみ）</text>

  <!-- perturbing shaft attached at bearing journal, going down -->
  <rect x="273" y="234" width="14" height="120" fill="#4a6fa5"/>
  <text x="360" y="300" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4a6fa5">摂動軸（回転速度 ω_p、ゆっくり掃引）</text>
  <circle cx="280" cy="370" r="18" fill="none" stroke="#4a6fa5" stroke-width="2"/>
  <text x="280" y="400" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#4a6fa5">制御されたアンバランス質量</text>

  <!-- probes -->
  <line x1="320" y1="180" x2="320" y2="150" stroke="#3a3a34" stroke-width="1.5"/>
  <text x="320" y="140" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#3a3a34">非接触変位プローブ（水平・垂直）</text>
</svg>
