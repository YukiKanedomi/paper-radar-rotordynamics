<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380" width="680" height="380">
  <rect width="680" height="380" fill="#faf9f5"/>
  <text x="340" y="30" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#1a5e54" font-weight="600">一体型モータとフォイル軸受のターボコンプレッサ（模式図）</text>
  <text x="340" y="50" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#6b6b63">模式・実データではない。抄録の記述（フォイル軸受・一体型モータ・ガスタイト設計）を概念化。</text>
  <text x="340" y="66" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#6b6b63">インペラの段数・軸受の個数と型式・位置・寸法は説明用で、実機の構成ではない（抄録に記載なし）。</text>

  <rect x="70" y="100" width="540" height="160" rx="14" fill="#ece8dc" stroke="#3a3a34" stroke-width="2.5"/>
  <text x="340" y="122" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#3a3a34">密閉されたケーシング（内部を炭化水素ガスが通る）</text>
  <rect x="100" y="172" width="480" height="16" fill="#3a3a34"/>
  <rect x="330" y="150" width="130" height="60" fill="#1a5e54" opacity="0.85"/>
  <text x="395" y="185" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#faf9f5">一体型モータ</text>
  <path d="M130 130 L190 160 L190 200 L130 230 Z" fill="#c9a86b" stroke="#3a3a34"/>
  <text x="150" y="252" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#3a3a34">インペラ</text>
  <rect x="215" y="158" width="26" height="44" fill="#dfeae6" stroke="#1a5e54" stroke-width="2"/>
  <rect x="500" y="158" width="26" height="44" fill="#dfeae6" stroke="#1a5e54" stroke-width="2"/>
  <text x="228" y="226" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1a5e54">フォイル軸受</text>
  <text x="513" y="226" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1a5e54">フォイル軸受</text>

  <text x="340" y="292" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#3a3a34">ガスタイト設計により、回転軸と継手から大気へガスが漏れない（抄録の記述）</text>
  <text x="340" y="312" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#3a3a34">試験ガス・圧力・回転数などの数値は抄録に無いため、図には描いていない。</text>
  <text x="340" y="346" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#6b6b63">抄録ベースの要約に添えた概念図。箔の形や潤滑の詳細は原論文で確認してください。</text>
</svg>
