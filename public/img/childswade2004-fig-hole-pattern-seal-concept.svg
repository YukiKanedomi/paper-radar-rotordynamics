<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400">
  <rect width="640" height="400" fill="#faf9f5"/>
  <text x="320" y="32" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#1a5e54" font-weight="600">ホールパターンステータ環状ガスシール（模式図）</text>
  <text x="320" y="52" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#6b6b63">模式図・実データではない。抄録の記述（滑らかなロータ＋穴パターンのステータ）を概念化。</text>
  <text x="320" y="68" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#6b6b63">穴の形・寸法・数は説明用（本サイト作成）</text>

  <!-- smooth rotor -->
  <rect x="110" y="98" width="420" height="42" fill="#3a3a34"/>
  <text x="320" y="124" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#faf9f5">滑らかなロータ（回転）</text>
  <!-- clearance -->
  <rect x="110" y="140" width="420" height="16" fill="#c9a86b" opacity="0.5"/>
  <!-- stator with holes -->
  <rect x="110" y="156" width="420" height="52" fill="#1a5e54" opacity="0.85"/>
  <g fill="#faf9f5" stroke="#1a5e54" stroke-width="1">
    <rect x="150" y="156" width="26" height="34"/><rect x="200" y="156" width="26" height="34"/><rect x="250" y="156" width="26" height="34"/>
    <rect x="300" y="156" width="26" height="34"/><rect x="350" y="156" width="26" height="34"/><rect x="400" y="156" width="26" height="34"/><rect x="450" y="156" width="26" height="34"/>
  </g>
  <text x="320" y="230" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1a5e54">穴のパターンを持つステータ</text>

  <!-- axial flow arrow -->
  <path d="M60 148 L100 148" stroke="#b4451f" stroke-width="2" marker-end="url(#b)"/>
  <path d="M540 148 L590 148" stroke="#b4451f" stroke-width="2" marker-end="url(#b)"/>
  <defs><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#b4451f"/></marker></defs>
  <text x="80" y="136" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#b4451f">高圧側</text>
  <text x="565" y="136" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#b4451f">低圧側</text>

  <text x="320" y="286" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#3a3a34">抄録によれば、供給圧70 bar・3水準の圧力比／回転数（最大20,000 rpm）／予旋回比・2水準のすきまで、</text>
  <text x="320" y="306" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#3a3a34">周波数依存の剛性・減衰係数と漏れを測り、2コントロールボリューム模型の予測とよく一致した。</text>
  <text x="320" y="352" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#6b6b63">穴の形・数・寸法は説明用の仮のもので、原論文の実形状ではない（抄録に記載なし）。</text>
</svg>
