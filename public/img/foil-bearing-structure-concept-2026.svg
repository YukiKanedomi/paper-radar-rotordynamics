<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 600 260'><rect width='600' height='260' fill='#faf9f5'/>
<text x='300' y='24' font-family='sans-serif' font-size='13' fill='#114a42' text-anchor='middle' font-weight='700'>フォイル軸受の基本構造（概念図）</text>

<circle cx='300' cy='140' r='46' fill='#6c7078' opacity='.25' stroke='#1d2127' stroke-width='1.6'/>
<text x='300' y='145' font-family='sans-serif' font-size='11' fill='#1d2127' text-anchor='middle' font-weight='700'>ロータ</text>

<circle cx='300' cy='140' r='70' fill='none' stroke='#1a5e54' stroke-width='2'/>
<text x='300' y='60' font-family='sans-serif' font-size='10.5' fill='#114a42' text-anchor='middle' font-weight='700'>トップフォイル（薄板）</text>

<circle cx='300' cy='140' r='86' fill='none' stroke='#1a5e54' stroke-width='2' stroke-dasharray='3 3'/>
<text x='300' y='40' font-family='sans-serif' font-size='10.5' fill='#114a42' text-anchor='middle' font-weight='700'>バンプフォイル（波状ばね）</text>

<path d='M370 140 A70 70 0 0 1 350 90' stroke='#c65b2e' stroke-width='6' fill='none' stroke-linecap='round'/>
<text x='430' y='95' font-family='sans-serif' font-size='10' fill='#c65b2e' text-anchor='middle' font-weight='700'>くさび状の</text>
<text x='430' y='109' font-family='sans-serif' font-size='10' fill='#c65b2e' text-anchor='middle' font-weight='700'>気体膜すきま</text>

<text x='300' y='232' font-family='sans-serif' font-size='9.5' fill='#6c7078' text-anchor='middle'>高速回転でロータとトップフォイルの間に動圧気体膜が形成され、バンプフォイルが構造剛性とクーロン摩擦減衰を与える</text>
<text x='300' y='250' font-family='sans-serif' font-size='9.5' fill='#6c7078' text-anchor='middle'>模式図・実データではない（本サイト作成）</text>
</svg>
