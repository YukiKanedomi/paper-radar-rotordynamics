<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" width="680" height="400">
  <rect width="680" height="400" fill="#faf9f5"/>
  <text x="340" y="30" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#1a5e54" font-weight="600">軸受の減衰を増やすと対数減衰率が上がる（模式図）</text>
  <text x="340" y="50" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#6b6b63">模式・実データではない。曲線の形・数値は説明用の仮のもの。安定の目安 0.20 は原文が文献を引いて述べる値。</text>

  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#3a3a34"/></marker></defs>
  <line x1="90" y1="330" x2="620" y2="330" stroke="#3a3a34" stroke-width="1.6" marker-end="url(#ar)"/>
  <line x1="90" y1="330" x2="90" y2="80" stroke="#3a3a34" stroke-width="1.6" marker-end="url(#ar)"/>
  <text x="355" y="368" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#3a3a34">軸受の減衰 B（大きいほど右）</text>
  <text x="34" y="205" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#3a3a34" transform="rotate(-90 34 205)">対数減衰率</text>

  <line x1="90" y1="270" x2="600" y2="270" stroke="#8a8a80" stroke-width="1"/>
  <text x="96" y="286" font-family="sans-serif" font-size="11" fill="#6b6b63">0（ここより下は不安定：揺れが成長する）</text>

  <line x1="90" y1="170" x2="600" y2="170" stroke="#b4451f" stroke-width="1.4" stroke-dasharray="6 5"/>
  <text x="596" y="162" text-anchor="end" font-family="sans-serif" font-size="12" fill="#b4451f">0.20（安定とみなす目安・原文が文献を引用）</text>

  <path d="M110 318 C 200 300, 260 250, 330 205 S 470 130, 590 112" fill="none" stroke="#1a5e54" stroke-width="3"/>
  <text x="470" y="106" font-family="sans-serif" font-size="12" fill="#1a5e54">軸受の減衰を増やした場合の対数減衰率</text>

  <line x1="391" y1="330" x2="391" y2="170" stroke="#1a5e54" stroke-width="1" stroke-dasharray="3 4"/>
  <circle cx="391" cy="170" r="5" fill="#1a5e54"/>
  <text x="397" y="318" font-family="sans-serif" font-size="12" fill="#1a5e54">0.20に届く点（ここから右が基準を満たす）</text>
  <text x="397" y="334" font-family="sans-serif" font-size="12" fill="#1a5e54">＝必要な最小減衰の考え方</text>
</svg>
