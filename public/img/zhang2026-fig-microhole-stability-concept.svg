<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400">
  <rect width="640" height="400" fill="#faf9f5"/>
  <text x="320" y="34" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#1a5e54" font-weight="600">給気孔の変更と半速振れ回りしきい値の関係（模式図）</text>
  <text x="320" y="56" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#6b6b63">模式図・実データではない。定性的な傾向のみを示す</text>

  <line x1="90" y1="330" x2="560" y2="330" stroke="#3a3a34" stroke-width="1.5"/>
  <line x1="90" y1="330" x2="90" y2="90" stroke="#3a3a34" stroke-width="1.5"/>
  <text x="560" y="352" text-anchor="end" font-family="sans-serif" font-size="12" fill="#3a3a34">軸受数 Λ（回転速度に相当）</text>
  <text x="70" y="90" text-anchor="end" font-family="sans-serif" font-size="12" fill="#3a3a34">振れ回り振幅</text>

  <path d="M 90 300 L 300 290 L 340 120 L 560 100" fill="none" stroke="#8a6d3b" stroke-width="2.5" stroke-dasharray="6,4"/>
  <text x="345" y="115" font-family="sans-serif" font-size="11" fill="#8a6d3b">小孔絞り軸受（Λ=3.39で不安定化）</text>

  <path d="M 90 300 L 340 288 L 385 120 L 560 105" fill="none" stroke="#1a5e54" stroke-width="3"/>
  <text x="390" y="140" font-family="sans-serif" font-size="11" fill="#1a5e54">マイクロホール軸受（Λ=3.75で不安定化）</text>

  <line x1="300" y1="90" x2="300" y2="330" stroke="#b4451f" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="340" y1="90" x2="340" y2="330" stroke="#1a5e54" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="320" y="365" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#6b6b63">給気孔をマイクロホール化すると、半速振れ回りが現れ始めるΛが約10%上昇（実機ではしきい値回転速度+10.5%）</text>
</svg>
