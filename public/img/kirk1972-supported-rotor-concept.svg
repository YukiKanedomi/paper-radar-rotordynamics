<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 410" width="640" height="410">
  <rect width="640" height="410" fill="#faf9f5"/>
  <text x="320" y="32" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#1a5e54" font-weight="600">弾性・減衰支持の上に載った単質量ロータ（模式図）</text>
  <text x="320" y="54" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#6b6b63">模式・実データではない。要素の並びだけを示す（論文の図1の力学モデルを言葉で描き直したもの）</text>

  <line x1="90" y1="120" x2="550" y2="120" stroke="#3a3a34" stroke-width="5"/>
  <line x1="130" y1="120" x2="130" y2="150" stroke="#3a3a34" stroke-width="4"/><line x1="510" y1="120" x2="510" y2="150" stroke="#3a3a34" stroke-width="4"/>
  <rect x="290" y="82" width="60" height="76" rx="4" fill="#d5e5e1" stroke="#1a5e54" stroke-width="2"/>
  <text x="320" y="126" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1a5e54">M₂</text>
  <text x="320" y="74" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1a5e54">ロータ質量（円板）</text>
  <text x="320" y="176" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#3a3a34">軸（ばね K_s で表す）</text>

  <g stroke="#3a3a34" stroke-width="2" fill="none">
    <rect x="102" y="150" width="56" height="34" fill="#eceae2"/>
    <rect x="482" y="150" width="56" height="34" fill="#eceae2"/>
    <path d="M 118 184 l 0 8 l -6 6 l 12 8 l -12 8 l 12 8 l -6 6 l 0 8"/>
    <path d="M 142 184 l 0 22"/><rect x="134" y="206" width="16" height="22" fill="#faf9f5"/><path d="M 142 228 l 0 14"/>
    <rect x="96" y="256" width="68" height="34" fill="#eceae2"/>
    <path d="M 118 290 l 0 6 l -6 6 l 12 8 l -12 8 l 12 8 l -6 6 l 0 6"/>
    <path d="M 142 290 l 0 26"/><rect x="134" y="316" width="16" height="22" fill="#faf9f5"/><path d="M 142 338 l 0 14"/>
    <line x1="80" y1="356" x2="184" y2="356"/>
    <path d="M 498 184 l 0 8 l -6 6 l 12 8 l -12 8 l 12 8 l -6 6 l 0 8"/>
    <path d="M 522 184 l 0 22"/><rect x="514" y="206" width="16" height="22" fill="#faf9f5"/><path d="M 522 228 l 0 14"/>
    <rect x="476" y="256" width="68" height="34" fill="#eceae2"/>
    <path d="M 498 290 l 0 6 l -6 6 l 12 8 l -12 8 l 12 8 l -6 6 l 0 6"/>
    <path d="M 522 290 l 0 26"/><rect x="514" y="316" width="16" height="22" fill="#faf9f5"/><path d="M 522 338 l 0 14"/>
    <line x1="460" y1="356" x2="564" y2="356"/>
  </g>
  <text x="130" y="171" font-family="sans-serif" font-size="12" fill="#3a3a34" text-anchor="middle">軸受</text>
  <text x="104" y="234" font-family="sans-serif" font-size="12" fill="#3a3a34" text-anchor="end">K_b</text>
  <text x="166" y="234" font-family="sans-serif" font-size="12" fill="#3a3a34">C_b</text>
  <text x="130" y="277" font-family="sans-serif" font-size="12" fill="#3a3a34" text-anchor="middle">支持質量 M₁</text>
  <text x="104" y="336" font-family="sans-serif" font-size="12" fill="#1a5e54" text-anchor="end">K₁</text>
  <text x="166" y="336" font-family="sans-serif" font-size="12" fill="#1a5e54">C₁（減衰）</text>
  <text x="320" y="372" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#3a3a34">両端とも同じ構成（左右対称）</text>
  <text x="320" y="392" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1a5e54">支持側の質量・剛性・減衰の選び方で、危険速度での振幅が変わる</text>
</svg>
