<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420">
  <rect width="720" height="420" fill="#faf9f5"/>
  <text x="360" y="30" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#1a5e54" font-weight="600">フォイル・ガス軸受の技術開発の道筋（年表の模式図）</text>
  <text x="360" y="50" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#6b6b63">模式・実データではない。本文の記述（年・世代の特徴）を並べ直した図。箔の形状は描いていない。</text>

  <line x1="40" y1="112" x2="680" y2="112" stroke="#3a3a34" stroke-width="2"/>
  <g font-family="sans-serif" font-size="12" fill="#3a3a34" text-anchor="middle">
    <circle cx="90" cy="112" r="6" fill="#1a5e54"/><text x="90" y="98">1953</text>
    <circle cx="200" cy="112" r="6" fill="#1a5e54"/><text x="200" y="98">1957</text>
    <circle cx="310" cy="112" r="6" fill="#1a5e54"/><text x="310" y="98">1962</text>
    <circle cx="420" cy="112" r="6" fill="#b4451f"/><text x="420" y="98">1967</text>
    <circle cx="530" cy="112" r="6" fill="#b4451f"/><text x="530" y="98">（第2世代）</text>
    <circle cx="640" cy="112" r="6" fill="#b4451f"/><text x="640" y="98">1980年代後半〜90年代初め</text>
  </g>
  <g font-family="sans-serif" font-size="11" fill="#3a3a34" text-anchor="middle">
    <text x="90" y="136">Blok &amp; Van Rossum</text><text x="90" y="151">透明プラスチック膜</text><text x="90" y="166">（油潤滑の観察）</text>
    <text x="200" y="136">Cameron &amp; Patel</text><text x="200" y="151">金属の箔＋熱電対</text><text x="200" y="166">（油膜温度の測定）</text>
    <text x="310" y="136">Gross の著書</text><text x="310" y="151">テープの空気膜を</text><text x="310" y="166">軸受として研究へ</text>
    <text x="420" y="136">ロンドンの</text><text x="420" y="151">ガス軸受シンポジウム</text><text x="420" y="166">（リーフ状の箔）</text>
    <text x="530" y="136">支持構造を</text><text x="530" y="151">用途に合わせて調整</text>
    <text x="640" y="136">Heshmat</text><text x="640" y="151">複数方向に剛性を調整</text>
  </g>

  <rect x="40" y="200" width="250" height="150" fill="#ece8dc" stroke="#c9a86b"/>
  <text x="165" y="222" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#3a3a34" font-weight="600">初期（張力支配）</text>
  <text x="165" y="244" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#3a3a34">テープ型の軸受。商用には</text>
  <text x="165" y="260" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#3a3a34">ならなかったが、後の軸受の</text>
  <text x="165" y="276" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#3a3a34">土台になった</text>

  <rect x="300" y="200" width="120" height="150" fill="#dfeae6" stroke="#1a5e54"/>
  <text x="360" y="222" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1a5e54" font-weight="600">第1世代</text>
  <text x="360" y="244" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#3a3a34">曲げ支配</text>
  <text x="360" y="260" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#3a3a34">リーフ型・</text>
  <text x="360" y="276" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#3a3a34">バンプ型</text>
  <text x="360" y="300" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#3a3a34">空調機(ACM)</text>
  <text x="360" y="316" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#3a3a34">向けに実用化</text>

  <rect x="430" y="200" width="120" height="150" fill="#dfeae6" stroke="#1a5e54"/>
  <text x="490" y="222" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1a5e54" font-weight="600">第2世代</text>
  <text x="490" y="244" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#3a3a34">支持構造を調整</text>
  <text x="490" y="260" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#3a3a34">（端の漏れ・</text>
  <text x="490" y="276" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#3a3a34">ミスアライメント等）</text>
  <text x="490" y="300" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#3a3a34">負荷容量は第1世代の</text>
  <text x="490" y="316" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#3a3a34">約2倍（本文の記述）</text>

  <rect x="560" y="200" width="120" height="150" fill="#dfeae6" stroke="#1a5e54"/>
  <text x="620" y="222" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#1a5e54" font-weight="600">第3世代</text>
  <text x="620" y="244" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#3a3a34">2方向以上で</text>
  <text x="620" y="260" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#3a3a34">剛性を調整</text>
  <text x="620" y="276" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#3a3a34">（多層バンプ等）</text>
  <text x="620" y="300" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#3a3a34">負荷容量は第2世代の</text>
  <text x="620" y="316" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#3a3a34">ほぼ2倍（本文の記述）</text>

  <text x="360" y="386" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#6b6b63">年の位置は等間隔に並べた説明用で、時間軸の縮尺ではない。「約2倍」は論文本文の記述で、この論文内に根拠データは無い。</text>
</svg>
