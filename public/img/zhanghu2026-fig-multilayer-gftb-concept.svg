<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400">
  <rect width="640" height="400" fill="#faf9f5"/>
  <text x="320" y="32" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#1a5e54" font-weight="600">多層ガスフォイルスラスト軸受のモデル化（模式図）</text>
  <text x="320" y="52" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#6b6b63">模式図・実データではない。解析手順は抄録の記述（等価剛性・減衰と気体膜の連成）に基づく。</text>
  <text x="320" y="68" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#6b6b63">箔の形・層数は説明用（本サイト作成）</text>

  <!-- rotating runner -->
  <rect x="90" y="96" width="460" height="22" fill="#3a3a34"/>
  <text x="320" y="112" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#faf9f5">回転するスラストランナ</text>
  <!-- gas film -->
  <path d="M90 118 L550 118 L550 132 L90 138 Z" fill="#c9a86b" opacity="0.55"/>
  <text x="556" y="130" font-family="sans-serif" font-size="11" fill="#8a6d3b">気体膜</text>
  <!-- top foil -->
  <path d="M90 138 L550 132 L550 140 L90 146 Z" fill="#1a5e54"/>
  <text x="556" y="146" font-family="sans-serif" font-size="11" fill="#1a5e54">トップフォイル</text>
  <!-- layered foils (schematic bumps) -->
  <path d="M90 146 q 30 -14 60 0 t 60 0 t 60 0 t 60 0 t 60 0 t 60 0 t 60 0 t 40 0" fill="none" stroke="#3a3a34" stroke-width="2"/>
  <path d="M90 168 q 30 -14 60 0 t 60 0 t 60 0 t 60 0 t 60 0 t 60 0 t 60 0 t 40 0" fill="none" stroke="#3a3a34" stroke-width="2"/>
  <text x="556" y="164" font-family="sans-serif" font-size="11" fill="#3a3a34">多層のフォイル</text>
  <rect x="90" y="184" width="460" height="16" fill="#8a8a80"/>
  <text x="556" y="196" font-family="sans-serif" font-size="11" fill="#3a3a34">ハウジング</text>

  <!-- arrow: FE analysis -> equivalent k, c -->
  <rect x="120" y="236" width="150" height="44" rx="4" fill="none" stroke="#3a3a34" stroke-width="1.2"/>
  <text x="195" y="256" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#3a3a34">有限要素解析</text>
  <text x="195" y="272" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#6b6b63">箔構造の剛性・減衰</text>
  <path d="M270 258 L330 258" stroke="#b4451f" stroke-width="1.6" marker-end="url(#a)"/>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#b4451f"/></marker></defs>
  <rect x="330" y="236" width="190" height="44" rx="4" fill="none" stroke="#b4451f" stroke-width="1.2"/>
  <text x="425" y="256" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#b4451f">等価ばね k・ダンパ c</text>
  <text x="425" y="272" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#6b6b63">気体膜厚と連成して解く</text>

  <text x="320" y="322" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#3a3a34">抄録によれば、圧縮性ガス潤滑理論と小摂動法で動的性能モデルを作り、</text>
  <text x="320" y="342" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#3a3a34">高速スラスト軸受試験台の動的加振試験と比較して動特性係数の変化を調べた。</text>
  <text x="320" y="376" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#6b6b63">箔・ランナの形や層数は一般的な構成に基づく作図で、本論文の構造ではない（抄録に記載なし）。</text>
</svg>
