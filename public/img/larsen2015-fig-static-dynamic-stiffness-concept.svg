<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" width="640" height="420">
  <rect width="640" height="420" fill="#faf9f5"/>
  <text x="320" y="32" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#1a5e54" font-weight="600">バンプ箔の静的剛性 ks と動的剛性 kd（模式図）</text>
  <text x="320" y="54" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#6b6b63">模式図・実データではない。原論文の荷重-変位線図（Fig.3）の定性的な特徴のみを概念化して本サイトで作成</text>

  <!-- axes -->
  <line x1="90" y1="330" x2="560" y2="330" stroke="#3a3a34" stroke-width="1.5"/>
  <line x1="90" y1="330" x2="90" y2="80" stroke="#3a3a34" stroke-width="1.5"/>
  <text x="325" y="362" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#3a3a34">変位（バンプ箔のたわみ）</text>
  <text x="34" y="205" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#3a3a34" transform="rotate(-90 34 205)">荷重</text>

  <!-- monotonic loading line: slope ks -->
  <path d="M90 330 L470 130" stroke="#1a5e54" stroke-width="2.5" fill="none"/>
  <text x="482" y="126" font-family="sans-serif" font-size="12" fill="#1a5e54" font-weight="600">静的剛性 ks</text>
  <text x="482" y="142" font-family="sans-serif" font-size="11" fill="#1a5e54">（単調に荷重を増す）</text>

  <!-- small hysteresis loops on the line: steeper slope kd -->
  <g stroke="#b4451f" stroke-width="2" fill="none">
    <path d="M210 267 L240 205 L262 216 L232 279 Z"/>
    <path d="M330 204 L360 142 L382 153 L352 216 Z"/>
  </g>
  <text x="210" y="160" font-family="sans-serif" font-size="12" fill="#b4451f" font-weight="600">動的剛性 kd</text>
  <text x="210" y="176" font-family="sans-serif" font-size="11" fill="#b4451f">（小さな荷重振動：傾きが急）</text>
  <line x1="262" y1="182" x2="290" y2="230" stroke="#b4451f" stroke-width="1" stroke-dasharray="3,3"/>

  <text x="320" y="392" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#3a3a34">定常たわみ（零次方程式）には ks、微小振動の応答（一次方程式）には kd を使い分ける、という考え方の図解。</text>
</svg>
