<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400">
  <rect width="640" height="400" fill="#faf9f5"/>
  <text x="320" y="34" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#1a5e54" font-weight="600">流体スクイーズフィルムダンパの仕組み（模式図）</text>
  <text x="320" y="56" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#6b6b63">模式図・実データではない。力学的な仕組みのみを示す</text>

  <g font-family="sans-serif">
    <rect x="150" y="130" width="340" height="14" fill="#8a6d3b"/>
    <text x="130" y="141" text-anchor="end" font-size="12" fill="#3a3a34">固定板</text>

    <rect x="150" y="230" width="340" height="14" fill="#1a5e54"/>
    <text x="130" y="241" text-anchor="end" font-size="12" fill="#3a3a34">可動板</text>

    <line x1="200" y1="144" x2="200" y2="230" stroke="#6b6b63" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="440" y1="144" x2="440" y2="230" stroke="#6b6b63" stroke-width="1" stroke-dasharray="3,3"/>
    <text x="320" y="195" text-anchor="middle" font-size="12" fill="#4a6fa5">流体スクイーズフィルム</text>

    <path d="M 240 222 L 240 152" stroke="#b4451f" stroke-width="2.5" marker-end="url(#arrow)"/>
    <text x="250" y="215" font-size="12" fill="#b4451f">可動板が近づく運動</text>

    <path d="M 320 152 L 320 222" stroke="#1a5e54" stroke-width="2.5" marker-end="url(#arrow2)"/>
    <text x="330" y="215" font-size="12" fill="#1a5e54">運動と逆向きの減衰力</text>
    <text x="320" y="350" text-anchor="middle" font-size="12" fill="#6b6b63">（押しつぶされた膜の粘性が生む、運動を妨げる向きの力）</text>
  </g>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b4451f"/>
    </marker>
    <marker id="arrow2" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a5e54"/>
    </marker>
  </defs>

  <text x="320" y="380" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#6b6b63">気体を作動流体にすると、極端な温度環境・強い放射線環境下でも機能するダンパになりうるとされる（抄録記載）</text>
</svg>
