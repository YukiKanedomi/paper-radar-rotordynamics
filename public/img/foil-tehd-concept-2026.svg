<text x='450' y='163' font-family='sans-serif' font-size='10' fill='#1d2127' text-anchor='middle'>熱膨張・遠心変形</text>

<circle cx='300' cy='215' r='60' fill='#1a5e54' opacity='.20' stroke='#1a5e54' stroke-width='2'/>
