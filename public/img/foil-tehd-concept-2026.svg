<text x='150' y='148' font-family='sans-serif' font-size='10' fill='#1d2127' text-anchor='middle'>圧力・厚み・</text>
<text x='150' y='163' font-family='sans-serif' font-size='10' fill='#1d2127' text-anchor='middle'>温度分布</text>

<circle cx='450' cy='140' r='68' fill='#6c7078' opacity='.14' stroke='#6c7078' stroke-width='2'/>
