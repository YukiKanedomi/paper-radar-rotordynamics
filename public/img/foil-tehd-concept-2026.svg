<text x='300' y='226' font-family='sans-serif' font-size='10' fill='#1d2127' text-anchor='middle'>接触部の空気ギャップの</text>
<text x='300' y='240' font-family='sans-serif' font-size='10' fill='#1d2127' text-anchor='middle'>熱抵抗</text>

