<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" width="640" height="420">
  <rect width="640" height="420" fill="#faf9f5"/>
  <text x="320" y="34" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#1a5e54" font-weight="600">単相油膜と気液二相流潤滑膜の違い（模式図）</text>
  <text x="320" y="56" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#6b6b63">模式図・実データではない。抄録の定性的な記述（安定性・承載能力の違い）をもとに本サイトで作成</text>

  <!-- left panel: monophasic -->
  <text x="160" y="90" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#3a3a34" font-weight="600">単相油膜</text>
  <rect x="60" y="110" width="200" height="40" fill="#8a6d3b" opacity="0.85"/>
  <rect x="60" y="150" width="200" height="18" fill="#c9a86b"/>
  <rect x="60" y="168" width="200" height="40" fill="#8a6d3b" opacity="0.85"/>
  <text x="160" y="240" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#3a3a34">均質な油膜——安定で承載能力が高い</text>

  <!-- right panel: two-phase -->
  <text x="480" y="90" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#3a3a34" font-weight="600">気液二相流潤滑膜</text>
  <rect x="380" y="110" width="200" height="40" fill="#8a6d3b" opacity="0.85"/>
  <rect x="380" y="150" width="200" height="18" fill="#c9a86b"/>
  <circle cx="410" cy="159" r="5" fill="#faf9f5" stroke="#3a3a34" stroke-width="1"/>
  <circle cx="450" cy="156" r="4" fill="#faf9f5" stroke="#3a3a34" stroke-width="1"/>
  <circle cx="490" cy="161" r="6" fill="#faf9f5" stroke="#3a3a34" stroke-width="1"/>
  <circle cx="530" cy="157" r="4" fill="#faf9f5" stroke="#3a3a34" stroke-width="1"/>
  <circle cx="560" cy="160" r="5" fill="#faf9f5" stroke="#3a3a34" stroke-width="1"/>
  <rect x="380" y="168" width="200" height="40" fill="#8a6d3b" opacity="0.85"/>
  <text x="480" y="240" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#b4451f">気泡混入で膜が不均質——安定性・承載能力が低下</text>

  <line x1="320" y1="90" x2="320" y2="240" stroke="#c9c4b6" stroke-width="1" stroke-dasharray="3,3"/>

  <text x="320" y="290" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#3a3a34">単相流体に比べ、気液二相流が作る潤滑膜は安定性・承載能力が弱く、</text>
  <text x="320" y="310" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#3a3a34">ロータの振動が伝わり・増幅されやすくなる（抄録のFindings）。</text>
  <text x="320" y="340" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#3a3a34">支持間隔やロータ質量は、支持剛性と外部励振の強さを介して</text>
  <text x="320" y="360" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#3a3a34">振動・温度上昇の特性を大きく左右すると報告されている。</text>
</svg>
