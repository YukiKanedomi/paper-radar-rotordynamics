<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 600 240'><rect width='600' height='240' fill='#faf9f5'/><text x='300' y='24' font-family='sans-serif' font-size='12.5' fill='#114a42' text-anchor='middle' font-weight='700'>オイルフリーエンジン＋高粘度油変速機のイメージ（模式・実データではない）</text><rect x='40' y='80' width='210' height='100' rx='8' fill='#1a5e54' opacity='.08'/><rect x='40' y='80' width='210' height='100' rx='8' fill='none' stroke='#1a5e54' stroke-width='1.8'/><text x='145' y='106' font-family='sans-serif' font-size='12' fill='#114a42' text-anchor='middle' font-weight='700'>エンジン</text><text x='145' y='128' font-family='sans-serif' font-size='11' fill='#1d2127' text-anchor='middle'>フォイル空気軸受で支持</text><text x='145' y='148' font-family='sans-serif' font-size='11' fill='#1d2127' text-anchor='middle'>（エンジン用の油系統なし）</text><rect x='350' y='80' width='210' height='100' rx='8' fill='#b4451f' opacity='.08'/><rect x='350' y='80' width='210' height='100' rx='8' fill='none' stroke='#b4451f' stroke-width='1.8'/><text x='455' y='106' font-family='sans-serif' font-size='12' fill='#8a3417' text-anchor='middle' font-weight='700'>変速機（ギアボックス）</text><text x='455' y='128' font-family='sans-serif' font-size='11' fill='#1d2127' text-anchor='middle'>高粘度のギア専用油で潤滑</text><text x='455' y='148' font-family='sans-serif' font-size='11' fill='#1d2127' text-anchor='middle'>低圧軸のスラストも受け持つ案</text><defs><marker id='da' markerWidth='8' markerHeight='8' refX='6' refY='3' orient='auto'><path d='M0,0 L6,3 L0,6 z' fill='#6c7078'/></marker></defs><path d='M252 130 L348 130' stroke='#6c7078' stroke-width='2' marker-end='url(#da)'/><text x='300' y='120' font-family='sans-serif' font-size='10' fill='#6c7078' text-anchor='middle'>カップリング</text><text x='300' y='150' font-family='sans-serif' font-size='9.5' fill='#6c7078' text-anchor='middle'>（トルク＋軸方向荷重）</text><text x='300' y='212' font-family='sans-serif' font-size='10' fill='#6c7078' text-anchor='middle'>構成の関係を表す模式図。寸法・部品の形は実際とは無関係</text></svg>
