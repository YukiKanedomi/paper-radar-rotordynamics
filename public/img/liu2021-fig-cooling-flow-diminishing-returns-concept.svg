<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400">
  <rect width="640" height="400" fill="#faf9f5"/>
  <text x="320" y="34" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#1a5e54" font-weight="600">冷却気体流量と冷却効果の関係（模式図）</text>
  <text x="320" y="56" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#6b6b63">模式図・実データではない。定性的な傾向のみを示す（100krpm・荷重100N条件）</text>

  <line x1="90" y1="330" x2="560" y2="330" stroke="#3a3a34" stroke-width="1.5"/>
  <line x1="90" y1="330" x2="90" y2="90" stroke="#3a3a34" stroke-width="1.5"/>
  <text x="560" y="352" text-anchor="end" font-family="sans-serif" font-size="12" fill="#3a3a34">冷却気体流量</text>
  <text x="70" y="90" text-anchor="end" font-family="sans-serif" font-size="12" fill="#3a3a34">軸受温度</text>

  <path d="M 90 110 C 160 180, 220 260, 260 290 C 350 310, 450 315, 560 305" fill="none" stroke="#b4451f" stroke-width="3"/>

  <line x1="260" y1="90" x2="260" y2="330" stroke="#6b6b63" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="260" y="345" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#6b6b63">0.2 m³/min</text>

  <text x="140" y="150" font-family="sans-serif" font-size="11" fill="#b4451f">温度が急速に低下</text>
  <text x="420" y="290" font-family="sans-serif" font-size="11" fill="#8a6d3b">それ以上増やしても効果は徐々に弱まる</text>

  <text x="320" y="380" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#6b6b63">原論文によれば、0.2 m³/minまでは急速に冷えるが、それを超えると冷却効果は徐々に弱まっていく</text>
</svg>
