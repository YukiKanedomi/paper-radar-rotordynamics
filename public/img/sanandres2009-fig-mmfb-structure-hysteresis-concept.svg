<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" width="640" height="420">
  <rect width="640" height="420" fill="#faf9f5"/>
  <text x="320" y="34" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#1a5e54" font-weight="600">メタルメッシュフォイル軸受(MMFB)の構造と荷重-たわみ挙動</text>
  <text x="320" y="56" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#6b6b63">模式図・実データではない。抄録の定性的な記述をもとに本サイトで作成</text>

  <!-- left: MMFB cross-section -->
  <text x="150" y="88" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#3a3a34" font-weight="600">MMFBの断面（模式）</text>
  <circle cx="150" cy="210" r="95" fill="none" stroke="#8a6d3b" stroke-width="10"/>
  <circle cx="150" cy="210" r="90" fill="none" stroke="#e9e5d8" stroke-width="14"/>
  <circle cx="150" cy="210" r="82" fill="none" stroke="#3a3a34" stroke-width="2"/>
  <circle cx="150" cy="210" r="62" fill="#c9c4b6" stroke="#3a3a34" stroke-width="1.5"/>
  <text x="150" y="215" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#3a3a34">ジャーナル(軸)</text>
  <text x="255" y="130" font-family="sans-serif" font-size="9" fill="#8a6d3b">軸受スリーブ（外側、一般的な呼称）</text>
  <text x="255" y="190" font-family="sans-serif" font-size="9" fill="#6b6b63">金網リング(銅線0.3mm)</text>
  <text x="255" y="250" font-family="sans-serif" font-size="9" fill="#3a3a34">滑らかな円弧状フォイル（一般的な呼称）</text>

  <!-- right: hysteresis loop -->
  <text x="480" y="88" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#3a3a34" font-weight="600">静荷重-たわみ特性（イメージ）</text>
  <line x1="370" y1="330" x2="370" y2="110" stroke="#3a3a34" stroke-width="1.5"/>
  <line x1="370" y1="240" x2="610" y2="240" stroke="#3a3a34" stroke-width="1.5"/>
  <text x="610" y="262" text-anchor="end" font-family="sans-serif" font-size="11" fill="#3a3a34">たわみ</text>
  <text x="350" y="115" text-anchor="end" font-family="sans-serif" font-size="11" fill="#3a3a34">荷重</text>
  <path d="M 375 235 L 580 125 C 500 195, 440 225, 375 235 Z"
        fill="#1a5e54" fill-opacity="0.14" stroke="#1a5e54" stroke-width="2.5"/>
  <path d="M 375 235 L 580 125" fill="none" stroke="#1a5e54" stroke-width="2.5"/>
  <path d="M 580 125 C 500 195, 440 225, 375 235" fill="none" stroke="#8a6d3b" stroke-width="2.5" stroke-dasharray="6,4"/>
  <text x="470" y="165" font-family="sans-serif" font-size="10" fill="#1a5e54">載荷（ほぼ線形）</text>
  <text x="440" y="215" font-family="sans-serif" font-size="10" fill="#8a6d3b">除荷（非線形・遅れ）</text>

  <text x="320" y="375" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#3a3a34">荷重-たわみ関係は3乗的な非線形性と大きなヒステリシスを示す——これが抄録の定性的な報告内容。</text>
  <text x="320" y="395" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#3a3a34">断面図のすきまは見やすさのため誇張。実際のグラフ形状・数値は原論文Figにのみ記載。</text>
</svg>
